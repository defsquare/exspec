<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1188 554" width="1188" height="554" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="to-same" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="to-added" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="to-removed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="to-changed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<rect width="1188" height="554" fill="#ffffff"/>
<polyline points="474,136 804,136" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#to-same)"/><text x="639" y="38" font-size="11" font-weight="400" text-anchor="middle" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke">judgement judges it on rule</text><text x="639" y="53" font-size="11" font-weight="400" text-anchor="middle" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke">scenario exercises rule</text><text x="639" y="68" font-size="11" font-weight="400" text-anchor="middle" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke">evidence is of the scenario of rule</text><text x="639" y="83" font-size="11" font-weight="400" text-anchor="middle" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke">scenario starts from state</text><text x="639" y="98" font-size="11" font-weight="400" text-anchor="middle" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke">judgement judges what is seen in state</text><text x="639" y="113" font-size="11" font-weight="400" text-anchor="middle" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke">step calls operation</text><text x="639" y="128" font-size="11" font-weight="400" text-anchor="middle" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke">step gives a service condition</text>
<polyline points="804,170 474,170" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#to-same)"/><text x="639" y="187" font-size="11" font-weight="400" text-anchor="middle" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke">state names its path scenario</text>
<polyline points="277,212 277,412" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#to-same)"/><text x="267" y="316" font-size="11" font-weight="400" text-anchor="end" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke">step sends a raw request to interface</text>
<polyline points="311,212 311,412" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#to-same)"/><text x="321" y="316" font-size="11" font-weight="400" text-anchor="start" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke">side effect was sent to provider</text>
<polyline points="984,412 984,212" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#to-same)"/><text x="974" y="301" font-size="11" font-weight="400" text-anchor="end" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke">trigger binds operation</text><text x="974" y="316" font-size="11" font-weight="400" text-anchor="end" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke">trigger says how it is refused shared rule</text><text x="974" y="331" font-size="11" font-weight="400" text-anchor="end" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke">renders renders service</text>
<polyline points="804,471 474,471" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#to-same)"/><text x="639" y="448" font-size="11" font-weight="400" text-anchor="middle" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke">trigger binds to interface</text><text x="639" y="463" font-size="11" font-weight="400" text-anchor="middle" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke">renders rendered by provider</text>
<rect x="114" y="94" width="360" height="118" rx="10" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="294" y="122" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">proof</text><text x="294" y="142" font-size="12" font-weight="400" text-anchor="middle" fill="#374151">what was played and what was made of it</text><text x="294" y="166" font-size="12" font-weight="400" text-anchor="middle" fill="#111827" font-style="italic">judgement, evidence (side effect), scenario (step)</text>
<rect x="804" y="94" width="360" height="118" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="984" y="122" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">specification</text><text x="984" y="142" font-size="12" font-weight="400" text-anchor="middle" fill="#374151">what survives the target being rewritten</text><text x="984" y="166" font-size="12" font-weight="400" text-anchor="middle" fill="#111827" font-style="italic">state, structure (field), rule, operation,</text><text x="984" y="182" font-size="12" font-weight="400" text-anchor="middle" fill="#111827" font-style="italic">shared rule, service (condition)</text>
<rect x="114" y="412" width="360" height="118" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="294" y="440" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">target</text><text x="294" y="460" font-size="12" font-weight="400" text-anchor="middle" fill="#374151">what may not survive a rewrite</text><text x="294" y="484" font-size="12" font-weight="400" text-anchor="middle" fill="#111827" font-style="italic">target, provider (twin), interface</text>
<rect x="804" y="412" width="360" height="118" rx="10" fill="#fff4d6" stroke="#b8860b" stroke-width="2"/><text x="984" y="440" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">bindings</text><text x="984" y="460" font-size="12" font-weight="400" text-anchor="middle" fill="#374151">the only shapes that know both sides</text><text x="984" y="484" font-size="12" font-weight="400" text-anchor="middle" fill="#111827" font-style="italic">trigger, renders</text>
</svg>
