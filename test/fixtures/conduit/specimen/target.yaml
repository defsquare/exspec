target: conduit
start: ["docker compose -f specimen/compose.yaml up -d --build"]
alive: { method: get, path: /tags, status: 200 }
seed: ["./specimen/seed.sh"]
reset: ["./specimen/reset.sh"]
stop: ["docker compose -f specimen/compose.yaml down -v"]
api: { base-url: "http://localhost:8085/api" }
credentials: specimen/credentials.json
