operation: favorite-article
takes:
  slug: { field: [Article, slug] }
requires:
  - { rule: signed-in, fact: the caller is signed in, otherwise: unauthenticated }
  - { rule: exists, fact: the article exists, otherwise: not-found }
answers: Article
effects:
  - rule: joins-favorites
    then: { says: "The caller's favorite is added to the article." }
